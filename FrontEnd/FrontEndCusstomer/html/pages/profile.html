<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ cá nhân | UniLifeT</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/auth.css"><link rel="stylesheet" href="../../css/profile.css"></head>
<body data-page="profile" data-root="../">
  <header data-site-header></header>
  <main class="container page-main">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Trang chủ</a><span>›</span><span>Hồ sơ cá nhân</span></nav>
    <div class="section-heading"><div><span class="eyebrow">Tài khoản</span><h1>Hồ sơ cá nhân</h1><p>Thông tin chỉ được tải cho tài khoản đang đăng nhập.</p></div></div>
    <div id="profile-notice" class="notice" role="status" hidden></div>
    <section class="profile-card">
      <div class="profile-heading"><span class="profile-avatar" id="profile-avatar">U</span><div><h2 id="profile-name">Đang tải hồ sơ…</h2><p id="profile-email"></p></div></div>
      <form id="profile-form" class="profile-form" hidden>
        <label class="field">Họ và tên<input name="userName" required></label>
        <label class="field">Email<input name="userEmail" type="email" required></label>
        <label class="field">Số điện thoại<input name="userPhone" type="tel"></label>
        <label class="field">Giới tính<input name="userGender"></label>
        <label class="field">Ngày sinh<input name="userBirthday" type="date"></label>
        <label class="field profile-address">Địa chỉ<input name="userAddress"></label>
        <div class="profile-actions"><button class="btn btn-secondary" type="button" id="profile-edit" disabled>Chỉnh sửa</button><button class="btn" type="submit" id="profile-save" disabled>Lưu thay đổi</button><button class="btn btn-secondary" type="button" id="profile-cancel" disabled>Hủy</button><button class="btn btn-secondary" type="button" data-logout>Đăng xuất</button></div>
      </form>
      <div class="profile-links"><a class="text-link" href="./favorites.html">Phòng yêu thích →</a><a class="text-link" href="./my-rentals.html">Lịch sử thuê →</a></div>
    </section>
  </main>
  <footer data-site-footer></footer><div class="toast" id="toast" role="status"></div>
  <script type="module" src="../../javascript/profile.js"></script>
</body>
</html>
