<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký | UniLifeT</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/auth.css"></head>
<body data-page="register" data-root="../">
  <header data-site-header></header>
  <main class="auth-shell container">
    <section class="auth-card"><span class="eyebrow">Tạo tài khoản</span><h1>Bắt đầu tìm chỗ ở</h1><p class="auth-lead">Điền thông tin theo yêu cầu đăng ký của UniLifeT.</p>
      <div id="form-message" class="notice" role="status" hidden></div>
      <form id="register-form" class="form-stack">
        <label class="field">Họ và tên<input name="userName" autocomplete="name" required></label>
        <label class="field">Email<input name="userEmail" type="email" autocomplete="email" required></label>
        <label class="field">Số điện thoại (không bắt buộc)<input name="userPhone" type="tel" autocomplete="tel"></label>
        <label class="field">Mật khẩu<span class="password-field"><input name="userPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-toggle-password aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button></span></label>
        <label class="field">Nhập lại mật khẩu<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="terms-check"><input name="terms" type="checkbox" required><span>Tôi đồng ý với điều khoản sử dụng UniLifeT.</span></label>
        <button class="btn" type="submit">Tạo tài khoản</button>
      </form>
      <p class="auth-switch">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
    </section>
  </main>
  <footer data-site-footer></footer><div class="toast" id="toast" role="status"></div>
  <script type="module" src="../../javascript/auth.js"></script>
</body>
</html>
