<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu | UniLifeT</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/auth.css"></head>
<body data-page="forgot-password" data-root="../">
  <header data-site-header></header>
  <main class="auth-shell container">
    <section class="auth-card"><span class="eyebrow">Khôi phục tài khoản</span><h1>Quên mật khẩu?</h1><p class="auth-lead">Nhập email để tiếp tục. Chức năng gửi email chưa được hỗ trợ bởi backend hiện tại.</p>
      <div class="notice info">Giao diện đã sẵn sàng; cần bổ sung API khôi phục mật khẩu trước khi gửi yêu cầu thật.</div>
      <form id="forgot-form" class="form-stack"><label class="field">Email<input name="email" type="email" autocomplete="email" required></label><button class="btn" type="submit">Kiểm tra hỗ trợ</button><p class="form-message" id="form-message" role="status"></p></form>
      <p class="auth-switch"><a href="./login.html">← Quay lại đăng nhập</a></p>
    </section>
  </main>
  <footer data-site-footer></footer><div class="toast" id="toast" role="status"></div>
  <script type="module" src="../../javascript/auth.js"></script>
</body>
</html>
