services:
  postgres:
    image: postgres:18
    container_name: unilifet-postgres
    environment:
      POSTGRES_DB: UniLifeT
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./Database/UniLifeT.sql:/docker-entrypoint-initdb.d/001-unilifet.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1' > /dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./BackEnd/UniLifeT
      dockerfile: Dockerfile
    container_name: unilifet-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/UniLifeT
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
